<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Volt</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="site-container">
        <div class="hero">
            <div class="hero-bg">
                <img src="./imgs/Lightning-background.jpg" class="hero-bg-img" alt="">
                <div class="hero-logo">
                    <img src="./imgs/Lightning-icon.png" class="company-logo">
                    <h1 class="company-title">Volt</h1>
                </div>
            </div>
            <p class="background-credits">Photo by
                <a href="https://unsplash.com/@melodyp" target="_blank" rel="noopener noreferrer">Mélody P</a>
                from
                <a href="https://unsplash.com/photos/lightning-bolt-striking-dark-night-sky-wFN9B3s_iik" target="_blank"
                    rel="noopener noreferrer">Unsplash</a>
            </p>
        </div>

        <div class="sign-up-container">

            <div class="sign-up-title-container">
                <div class="sign-up-title-text">
                    <div class="sign-up-now-text">
                        <p>This is not a real online service! You know you need something like this in your life to help
                            you
                            realize your deepest dreams.</p>
                        <p>Sign up <em>now</em> to get started.</p>
                    </div>
                    <div class="you-know-text">
                        <p>You <em>know</em> you want to.</p>
                    </div>
                </div>
            </div>

            <div class="sign-up-form-container">

                <form method="post" action="" id="sign-up-form">
                    
                    <h1 class="form-title">Let's do this!</h1>

                    <div class="form-row">
                        <p class="input-container">
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" name="first-name">
                        </p>

                        <p class="input-container">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" name="last-name">
                        </p>
                    </div>

                    <div class="form-row">
                        <p class="input-container">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email">
                        </p>

                        <p class="input-container">
                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="tel" id="phone-number" name="phone-number">
                        </p>                
                    </div>
                    
                    <div class="form-row">
                        <p class="input-container">
                            <label for="pwd">PASSWORD</label>
                            <input type="password" id="pwd" name="password" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d#%+_]{8,}$" required>
                        </p>

                        <p class="input-container">
                            <label for="confirm-pwd">CONFIRM PASSWORD</label>
                            <input type="password" id="confirm-pwd" name="confirm-pwd" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d#%+_]{8,}$" required>
                        </p>                
                    </div>
                </form>

            </div>

            <div class="sign-up-end-container">
                
            </div>

        </div>
    </div>

    <footer class="footer">
        <p>Made By
            <a href="https://github.com/Vanshgoyal5102007" target="_blank" rel="noopener noreferrer"
                style="color: inherit;">Vansh Goyal</a>
            on GitHub
        </p>
    </footer>

</body>

</html>
